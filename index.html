<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Converter by ALIF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>

    <!-- Split Screen Workspace for Image to ASCII Mode -->
    <div id="workspace" class="workspace hidden">
        <div class="preview-pane">
            <h3>ORIGINAL IMAGE</h3>
            <div class="image-preview-box">
                <img id="sourceImagePreview" alt="Upload an image">
            </div>
        </div>
        <div class="ascii-pane">
            <div class="ascii-pane-header">
                <h3>ASCII ART PREVIEW (ALIF)</h3>
                <div class="pane-actions">
                    <button id="paneDownloadBtn">DOWNLOAD</button>
                    <button id="closeWorkspaceBtn">&times; CLOSE</button>
                </div>
            </div>
            <div class="ascii-scroll-container">
                <pre id="asciiPre"></pre>
                <div class="watermark">BY ALIF</div>
            </div>
        </div>
    </div>

    <!-- Main UI Container -->
    <div class="ui-container" id="uiContainer">
        <h1 class="glow-title">ASCII CONVERTER</h1>
        <div class="status-box">
            <span class="status-dot"></span> SYSTEM ONLINE &bull; BY ALIF
        </div>

        <div class="mode-toggle">
            <button id="matrixModeBtn" class="active">MATRIX RAIN</button>
            <button id="imageModeBtn">IMAGE TO ASCII</button>
        </div>

        <!-- Image Mode Panel -->
        <div id="imagePanel" class="panel hidden">
            <input type="file" id="imageUpload" accept="image/*" hidden>
            <button id="uploadBtn" class="primary-btn">📁 UPLOAD IMAGE TO CONVERT</button>

            <div class="ascii-controls">
                <label>CHARACTERS</label>
                <input type="text" id="charSet" value=" .:-=+*#%@">
            </div>
            <div class="ascii-controls">
                <label>RESOLUTION: <span id="resVal">70</span></label>
                <input type="range" id="resolution" min="20" max="150" value="70">
            </div>
            <div class="ascii-controls">
                <label><input type="checkbox" id="invertCheck"> INVERT COLORS</label>
            </div>
        </div>

        <div class="controls" id="matrixControls">
            <button id="startBtn">START</button>
            <button id="pauseBtn">PAUSE</button>
            <button id="clearBtn">CLEAR</button>
        </div>
        <div class="speed-control" id="speedControlBox">
            <label for="speedRange">SPEED</label>
            <input type="range" id="speedRange" min="1" max="100" value="50">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
