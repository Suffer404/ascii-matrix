<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Converter by ALIF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>
    <canvas id="asciiCanvas" class="hidden"></canvas>

    <div class="ui-container" id="uiContainer">
        <h1 class="glow-title">ASCII CONVERTER</h1>
        <div class="status-box">
            <span class="status-dot"></span> SYSTEM ONLINE &bull; BY ALIF
        </div>

        <div class="mode-toggle">
            <button id="matrixModeBtn" class="active">MATRIX RAIN</button>
            <button id="imageModeBtn">IMAGE TO ASCII</button>
        </div>

        <!-- Image Mode Panel -->
        <div id="imagePanel" class="panel hidden">
            <input type="file" id="imageUpload" accept="image/*" hidden>
            <button id="uploadBtn">UPLOAD IMAGE</button>

            <div class="ascii-controls">
                <label>CHARACTERS</label>
                <input type="text" id="charSet" value=" .:-=+*#%@">
            </div>
            <div class="ascii-controls">
                <label>RESOLUTION: <span id="resVal">80</span></label>
                <input type="range" id="resolution" min="20" max="200" value="80">
            </div>
            <div class="ascii-controls">
                <label><input type="checkbox" id="invertCheck"> INVERT</label>
            </div>
        </div>

        <div class="controls" id="matrixControls">
            <button id="startBtn">START</button>
            <button id="pauseBtn">PAUSE</button>
            <button id="clearBtn">CLEAR</button>
        </div>
        <div class="speed-control" id="speedControlBox">
            <label for="speedRange">SPEED</label>
            <input type="range" id="speedRange" min="1" max="100" value="50">
        </div>
    </div>

    <!-- Preview Modal / Overlay -->
    <div id="previewOverlay" class="preview-overlay hidden">
        <div class="preview-header">
            <span>ASCII PREVIEW (ALIF)</span>
            <div class="preview-actions">
                <button id="previewDownloadBtn">DOWNLOAD</button>
                <button id="backToEditBtn">BACK TO EDIT</button>
            </div>
        </div>
        <div class="preview-container">
            <pre id="asciiPre"></pre>
            <div class="watermark">CREATED BY ALIF</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
